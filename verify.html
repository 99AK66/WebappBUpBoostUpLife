<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจสอบการ์ด • BUP Boost Up Life</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e8fbf8; font-family: sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #msg { padding: 40px 20px; text-align: center; color: #263B53; }
  </style>
</head>
<body>
<iframe id="f" title="ตรวจสอบการ์ด" referrerpolicy="no-referrer" hidden></iframe>
<div id="msg">กำลังโหลด...</div>
<script>
  
var EXEC = 'https://script.google.com/macros/s/AKfycbw0A1i3pUMMrE6swKtj757qNa5o_Ev-6nf8RysOzPEVQOEu6stxAp2xznzjSnjVmxI49g/exec';

var KEYS = ['verify', 'n', 'd', 'g', 'k'];
var src = new URLSearchParams(location.search), out = new URLSearchParams();
KEYS.forEach(function (k) { if (src.has(k)) out.set(k, src.get(k)); });

if (!out.get('verify')) {
  document.getElementById('msg').textContent = 'ลิงก์ไม่ถูกต้อง ไม่พบรหัสตรวจสอบ';
} else {
  var f = document.getElementById('f');
  f.onload = function () { document.getElementById('msg').style.display = 'none'; f.hidden = false; };
  f.src = EXEC + '?' + out.toString();
}
</script>
</body>
</html>
