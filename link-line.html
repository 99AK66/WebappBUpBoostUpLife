<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เชื่อมบัญชี LINE</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:50px 20px">
  <div id="m" style="font-size:16px;line-height:1.9">
    กำลังตรวจสอบลิงก์...
  </div>

  <script>
    const LIFF_ID = '2011987956-58Mx5Z3v';
    const API = 'https://script.google.com/macros/s/AKfycbyC0m5u1JcqmNClJhnCbIFT2MYQcj_gzt-64-rkJol1y0t58ekJ-TiO6hgjV_7zA2oK/exec';

    (async function () {
      const m = document.getElementById('m');

      try {
        const params = new URLSearchParams(location.search);
        const ticket = params.get('t');

        // แสดงสาเหตุให้ชัดเจน
        if (!ticket) {
          m.textContent =
            '❌ ไม่พบ Ticket กรุณากลับไปหน้าจอง SDP แล้วกดเชื่อม LINE ใหม่';
          return;
        }

        m.textContent = 'กำลังเปิด LINE...';

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: location.href
          });
          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          m.textContent =
            '❌ ไม่พบ LINE ID Token กรุณาตรวจสอบ LIFF และสิทธิ์ openid';
          return;
        }

        m.textContent = 'กำลังตรวจสอบบัญชี LINE...';

        const url = API
          + '?action=linkLine'
          + '&t=' + encodeURIComponent(ticket)
          + '&idToken=' + encodeURIComponent(idToken);

        const response = await fetch(url);
        const result = await response.json();

        m.textContent = result.message
          || (result.success
              ? '✅ เชื่อมบัญชี LINE สำเร็จ'
              : '❌ เชื่อมบัญชีไม่สำเร็จ');

      } catch (err) {
        m.textContent = '❌ เกิดข้อผิดพลาด: ' + err.message;
      }
    })();
  </script>
</body>
</html>
