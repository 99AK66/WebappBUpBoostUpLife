<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เชื่อมบัญชี LINE</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:50px 20px">
  <div id="m" style="font-size:16px;line-height:1.9">กำลังตรวจสอบลิงก์...</div>
  <script>
    const LIFF_ID = '2011987956-58Mx5Z3v';
    const API = 'https://script.google.com/macros/s/AKfycbw0A1i3pUMMrE6swKtj757qNa5o_Ev-6nf8RysOzPEVQOEu6stxAp2xznzjSnjVmxI49g/exec';

    function getTicket() {
      const p = new URLSearchParams(location.search);
      let t = p.get('t');
      if (!t && p.get('liff.state')) {
        const s = decodeURIComponent(p.get('liff.state'));   // เช่น "?t=xxxx"
        t = new URLSearchParams(s.replace(/^\/?\??/, '')).get('t');
      }
      if (t) { try { sessionStorage.setItem('linkTicket', t); } catch (e) {} }
      else { try { t = sessionStorage.getItem('linkTicket'); } catch (e) {} }
      return t;
    }

    (async function () {
      const m = document.getElementById('m');
      try {
        const ticket = getTicket();          // อ่านก่อน liff.init
        if (!ticket) {
          m.textContent = '❌ ไม่พบ Ticket กรุณากลับไปหน้าจอง SDP แล้วกดเชื่อม LINE ใหม่';
          return;
        }
        m.textContent = 'กำลังเปิด LINE...';
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

        const idToken = liff.getIDToken();
        if (!idToken) {
          m.textContent = '❌ ไม่พบ ID Token ตรวจสอบ scope openid ของ LIFF';
          return;
        }
        m.textContent = 'กำลังตรวจสอบบัญชี LINE...';
        const r = await fetch(API + '?action=linkLine&t=' + encodeURIComponent(ticket)
                              + '&idToken=' + encodeURIComponent(idToken));
        const j = await r.json();
        m.textContent = j.message || (j.success ? '✅ เชื่อมบัญชี LINE สำเร็จ' : '❌ เชื่อมบัญชีไม่สำเร็จ');
        if (j.success) { try { sessionStorage.removeItem('linkTicket'); } catch (e) {} }
      } catch (err) {
        m.textContent = '❌ เกิดข้อผิดพลาด: ' + err.message;
      }
    })();
  </script>
</body>
</html>
