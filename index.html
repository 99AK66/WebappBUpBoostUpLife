<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebappBUpBoostUpLife</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { margin: 0; font-family: 'Kanit', 'IBM Plex Sans Thai', sans-serif; }
    .swal2-popup { font-family: inherit; }
  </style>
</head>
<body>

  <iframe id="mainFrame"
  src="about:blank"
  allow="geolocation; clipboard-write; web-share"
  style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;">
</iframe>

  <script>
  (function(){
    const params = new URLSearchParams(window.location.search);
    const APPS_SCRIPT_BASE = 'https://script.google.com/macros/s/AKfycbw0A1i3pUMMrE6swKtj757qNa5o_Ev-6nf8RysOzPEVQOEu6stxAp2xznzjSnjVmxI49g/exec';
    const iframe = document.getElementById('mainFrame');

    // ── กรณี login ล้มเหลว ──
    if (params.get('loginError')) {
      const errorHtml = params.get('loginError');
      history.replaceState({}, document.title, window.location.pathname);

      Swal.fire({
        icon: 'error',
        title: 'เข้าสู่ระบบไม่สำเร็จ',
        html: errorHtml,
        confirmButtonText: 'ตกลง',
        allowOutsideClick: false,
        allowEscapeKey: false,
        customClass: { popup: 'rounded-4 shadow-lg' }
      }).then(() => {
        iframe.src = APPS_SCRIPT_BASE + '?action=login';
      });
      return;
    }

    // ── กรณี login สำเร็จ (Google / LINE) ──
    const token = params.get('token');
    if (token) {
      history.replaceState({}, document.title, window.location.pathname);
      const role = params.get('role');
      const provider = params.get('provider') || 'google';
      const targetAction = (role === 'admin' || role === 'staff' || role === 'sdp_staff') ? 'admin' : 'user';
      const targetUrl = APPS_SCRIPT_BASE + '?action=' + targetAction
        + '&token=' + encodeURIComponent(token)
        + '&role=' + encodeURIComponent(role || '')
        + '&provider=' + encodeURIComponent(provider);

      Swal.fire({
        icon: 'success',
        title: 'เข้าสู่ระบบสำเร็จ',
        toast: true,
        position: 'top',
        showConfirmButton: false,
        timer: 2200,
        timerProgressBar: true,
        customClass: { popup: 'rounded-4 shadow' }
      });

      iframe.src = targetUrl;
      return;
    }

    // ── (ใหม่) ลิงก์จากการ์ด LINE: ปุ่ม "จองทันที" / "เลือกเอง" ──
    if (params.get('action') === 'sdpRebook') {
      const rb = params.get('rb') || '';
      const m = params.get('m') || '';
      const src = params.get('src') || '';
      if (/^[0-9a-f-]{36}$/i.test(rb)) {
        history.replaceState({}, document.title, window.location.pathname);
        iframe.src = APPS_SCRIPT_BASE + '?action=sdpRebook&rb=' + encodeURIComponent(rb)
          + (m === 'change' ? '&m=change' : '')
          + (/^[a-z_]{2,20}$/.test(src) ? '&src=' + encodeURIComponent(src) : '');
        return;
      }
    }

    // ── เข้าหน้าจอง SDP ด้วย ticket (จาก e-card หรือจากการ์ด LINE) ──
    const ticket = params.get('ticket');
    if (ticket && /^[0-9a-f-]{36}$/i.test(ticket)) {
      const card = params.get('card') || '';
      const src = params.get('src') || '';
      history.replaceState({}, document.title, window.location.pathname);
      iframe.src = APPS_SCRIPT_BASE + '?action=sdpBooking&ticket=' + encodeURIComponent(ticket)
        + (/^[A-Za-z0-9]{4,10}$/.test(card) ? '&card=' + encodeURIComponent(card) : '')
        + (/^[a-z_]{2,20}$/.test(src) ? '&src=' + encodeURIComponent(src) : '');
      return;
    }

    // ── กรณีปกติ ไม่มี token/error ──
    iframe.src = APPS_SCRIPT_BASE + '?action=login';
  })();
  </script>
</body>
</html>
