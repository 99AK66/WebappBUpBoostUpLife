<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebappBUpBoostUpLife</title>
</head>

<body style="margin:0;">

  <iframe
    id="mainFrame"
    allow="geolocation; clipboard-write"
    style="
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      border:0;
    ">
  </iframe>

  <script>
  (function () {

    const APPS_SCRIPT_BASE =
      'https://script.google.com/macros/s/AKfycbwFnngjZaChG6s5eMV2fRVOUKSwd7JOwVm_y1g8nUrSt-sxOyGbEXXhdja3PNBsMJq3Gg/exec';

    const iframe = document.getElementById('mainFrame');

    const params = new URLSearchParams(window.location.search);

    const token = params.get('token');
    const role = params.get('role');
    const loginError = params.get('loginError');


    // =====================================================
    // 1. LOGIN ERROR
    // =====================================================

    if (loginError) {

      alert(
        'เข้าสู่ระบบไม่สำเร็จ: ' +
        decodeURIComponent(loginError)
      );

      // ล้าง query string
      history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      // กลับไปหน้า Login
      iframe.src =
        APPS_SCRIPT_BASE + '?action=login';

      return;
    }


    // =====================================================
    // 2. LOGIN SUCCESS
    // =====================================================

    if (token) {

      // กำหนดหน้าเป้าหมายจาก role
      const targetAction =
        (role === 'admin' || role === 'staff')
          ? 'admin'
          : 'user';


      // สร้าง URL สำหรับ Apps Script
      const targetUrl =
        APPS_SCRIPT_BASE +
        '?action=' +
        encodeURIComponent(targetAction) +
        '&token=' +
        encodeURIComponent(token) +
        '&role=' +
        encodeURIComponent(role || '');


      // ล้าง token ออกจาก URL ของ Wrapper
      // แต่จะไม่ล้างค่าก่อนสร้าง targetUrl
      history.replaceState(
        {},
        document.title,
        window.location.pathname
      );


      // ส่ง token เข้า Apps Script เพียงครั้งเดียว
      iframe.src = targetUrl;

      return;
    }


    // =====================================================
    // 3. NORMAL OPEN / NO TOKEN
    // =====================================================

    iframe.src =
      APPS_SCRIPT_BASE + '?action=login';

  })();
  </script>

</body>
</html>
