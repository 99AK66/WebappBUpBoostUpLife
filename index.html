<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebappBUpBoostUpLife</title>
</head>

<body style="margin:0;">

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwFnngjZaChG6s5eMV2fRVOUKSwd7JOwVm_y1g8nUrSt-sxOyGbEXXhdja3PNBsMJq3Gg/exec"
    allow="geolocation"
    style="
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      border:0;
    ">
  </iframe>

  <script>
    (function () {

      const params = new URLSearchParams(window.location.search);

      const APPS_SCRIPT_BASE =
        'https://script.google.com/macros/s/AKfycbwFnngjZaChG6s5eMV2fRVOUKSwd7JOwVm_y1g8nUrSt-sxOyGbEXXhdja3PNBsMJq3Gg/exec';

      const iframe = document.getElementById('appFrame');

      if (!iframe) {
        console.error('❌ ไม่พบ iframe #appFrame');
        return;
      }

      const loginError = params.get('loginError');

      if (loginError) {

        alert(
          'เข้าสู่ระบบไม่สำเร็จ: ' +
          loginError
        );

        history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        iframe.src =
          APPS_SCRIPT_BASE +
          '?action=login';

        return;
      }

      const token = params.get('token');

      if (token) {

        // ล้าง token ออกจาก Address Bar
        history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        const role = params.get('role');

        const targetAction =
          (role === 'admin' || role === 'staff')
            ? 'admin'
            : 'user';

        iframe.src =
          APPS_SCRIPT_BASE +
          '?action=' +
          encodeURIComponent(targetAction) +
          '&token=' +
          encodeURIComponent(token) +
          '&role=' +
          encodeURIComponent(role || '');

      }

    })();
  </script>

</body>
</html>
